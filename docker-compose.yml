version: "3.9"

secrets:
  cloudflared_token:
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token-file /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token

  caddy:
    image: caddy:latest
    ports:
      - 80:80/tcp
      - 443:443/tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - cloudflared